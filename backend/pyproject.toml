[project]
name = "renovatie-backend"
version = "0.1.0"
description = "REST API backend for Renovatie, a kanban-style renovation project management tool"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0",
    "python-multipart>=0.0.9",
]

[dependency-groups]
dev = [
    "black>=24.0",
    "pyright>=1.1",
]

[tool.black]
line-length = 100

[tool.pyright]
include = ["app"]
typeCheckingMode = "strict"
